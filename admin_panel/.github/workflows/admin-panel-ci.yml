name: Admin Panel CI

on:
  pull_request:
    paths:
      - "admin_panel/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "admin_panel/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: admin-panel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_panel
    env:
      # Build-only placeholders; never use these values for a deployed environment.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin_panel/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
